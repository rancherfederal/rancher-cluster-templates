name: Release Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  chart-release:
    name: Chart Release Job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Helm Chart Releaser
        id: cr
        uses: helm/chart-releaser-action@v1
        with:
          skip_existing: true
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      - name: Authenticate to GitHub Container Registry
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Chart(s) to GitHub Container Registry
        if: steps.cr.outputs.changed_charts != ''
        run: |
          for package in .cr-release-packages/*; do
            if [ -z "${package:-}" ]; then
              break
            fi
            helm push "${package}" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
